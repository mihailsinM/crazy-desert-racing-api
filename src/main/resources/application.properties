spring.application.name=racing
spring.config.import=optional:file:./.env.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

crazy.jwt.secret=${CRAZY_JWT_SECRET}
crazy.chat.encryption-key=${CHAT_ENCRYPTION_KEY}

crazy.super-admin.enabled=${CRAZY_SUPER_ADMIN_ENABLED:false}
crazy.super-admin.email=${CRAZY_SUPER_ADMIN_EMAIL:}
crazy.super-admin.password=${CRAZY_SUPER_ADMIN_PASSWORD:}
crazy.super-admin.name=${CRAZY_SUPER_ADMIN_NAME:Michael}

crazy.demo-seed.enabled=${CRAZY_DEMO_SEED_ENABLED:false}
crazy.demo-seed.user-password=${CRAZY_DEMO_USER_PASSWORD:}
crazy.demo-seed.reset-confirmation=${CRAZY_DEMO_SEED_RESET_CONFIRMATION:}
